<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Merkmalsvektor aus 41 NX-Zwangsbedingungen, Klassifikationsnetz und Verteilung der Gelenktypen mit automatischer Verifikation">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .panel { fill: #F7F8F5; stroke: #C8CCC4; stroke-width: 1.2; }
      .kicker { font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #2F5D46; }
      .title { font-family: 'Libre Bodoni', Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 600; fill: #171A17; }
      .body { font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #171A17; }
      .muted { font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #555B54; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; fill: #171A17; }
      .bar-bg { fill: #E4E7E1; }
      .bar-green { fill: #2F5D46; }
      .bar-mid { fill: #63937B; }
      .box { fill: #FFFFFF; stroke: #C8CCC4; stroke-width: 1.1; }
    </style>
  </defs>

  <rect class="bg" width="900" height="460"/>

  <!-- LEFT: CONSTRAINT PATTERN EXAMPLES -->
  <rect class="panel" x="20" y="20" width="420" height="420" rx="4"/>
  <text class="kicker" x="40" y="48">Merkmals-Codierung · 41 Features</text>
  <text class="title" x="40" y="72">Von der NX-Baugruppe zum Gelenktyp</text>
  <text class="muted" x="40" y="92">Jedes gepaarte Bauteil wird als Constraint-Muster dargestellt</text>

  <rect class="box" x="40" y="110" width="380" height="94" rx="3"/>
  <text class="body" x="56" y="132" font-weight="600">Beispiel 1: Welle in Gehäusebohrung</text>
  <text class="mono" x="56" y="154">Align (Zylinderachse) = 1 · Touch (Stirnfläche) = 1</text>
  <text class="body" x="56" y="178" fill="#2F5D46" font-weight="600">→ Vorhersage: Drehgelenk (Revolute, 1 DOF)</text>

  <rect class="box" x="40" y="216" width="380" height="94" rx="3"/>
  <text class="body" x="56" y="238" font-weight="600">Beispiel 2: Führungsbolzen ohne Axialanschlag</text>
  <text class="mono" x="56" y="260">Align (Zylinderachse) = 1 · Touch = 0 · Parallel = 0</text>
  <text class="body" x="56" y="284" fill="#2F5D46" font-weight="600">→ Vorhersage: Zylindergelenk (Cylinder, 2 DOF)</text>

  <rect class="box" x="40" y="322" width="380" height="98" rx="3"/>
  <text class="body" x="56" y="344" font-weight="600">Beispiel 3: Verschraubte Grundplatte</text>
  <text class="mono" x="56" y="366">Touch (Ebene) = 1 · Align (2× Bohrung) = 2</text>
  <text class="body" x="56" y="390" fill="#2F5D46" font-weight="600">→ Vorhersage: Festverbindung (Fixed, 0 DOF)</text>

  <!-- RIGHT: CLASS DISTRIBUTION & SELF-CHECK -->
  <rect class="panel" x="460" y="20" width="420" height="420" rx="4"/>
  <text class="kicker" x="480" y="48">Gelenkklassen &amp; Qualitätssicherung</text>
  <text class="title" x="480" y="72">Häufigste Gelenke &amp; Selbstprüfung</text>
  <text class="muted" x="480" y="92">Stratifizierter Baugruppen-Datensatz + Geometrieabgleich</text>

  <rect class="box" x="480" y="110" width="380" height="172" rx="3"/>
  <text class="body" x="496" y="134" font-weight="600">Verteilung im gelabelten Baugruppen-Kernsatz</text>

  <text class="body" x="496" y="164">Revolute (Drehgelenk)</text>
  <rect class="bar-bg" x="650" y="152" width="145" height="14" rx="2"/>
  <rect class="bar-green" x="650" y="152" width="115" height="14" rx="2"/>
  <text class="mono" x="803" y="164">51 %</text>

  <text class="body" x="496" y="194">Cylinder (Zylindergelenk)</text>
  <rect class="bar-bg" x="650" y="182" width="145" height="14" rx="2"/>
  <rect class="bar-green" x="650" y="182" width="54" height="14" rx="2"/>
  <text class="mono" x="803" y="194">24 %</text>

  <text class="body" x="496" y="224">Planar (Ebenengelenk)</text>
  <rect class="bar-bg" x="650" y="212" width="145" height="14" rx="2"/>
  <rect class="bar-mid" x="650" y="212" width="29" height="14" rx="2"/>
  <text class="mono" x="803" y="224">13 %</text>

  <text class="body" x="496" y="254">Fixed &amp; Sonderklassen</text>
  <rect class="bar-bg" x="650" y="242" width="145" height="14" rx="2"/>
  <rect class="bar-mid" x="650" y="242" width="24" height="14" rx="2"/>
  <text class="mono" x="803" y="254">12 %</text>

  <rect class="box" x="480" y="296" width="380" height="124" rx="3"/>
  <text class="body" x="496" y="320" font-weight="600" fill="#2F5D46">Warum die automatische Verifikation entscheidend ist</text>
  <text class="muted" x="496" y="342">• Jede Vorhersage liefert eine Klassen-Wahrscheinlichkeit</text>
  <text class="muted" x="496" y="362">• Nach dem XML-Aufbau vergleicht die Pipeline die</text>
  <text class="muted" x="496" y="380">  Gelenkkoordinaten in Simscape mit dem NX-Original</text>
  <text class="muted" x="496" y="400">• Unklare oder verschobene Gelenke werden sofort markiert</text>
</svg>
